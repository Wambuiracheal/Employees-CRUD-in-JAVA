server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: employees-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employees}
    username: ${DB_USERNAME:employees}
    password: ${DB_PASSWORD:employees}
  jpa:
    # Schema is owned by Flyway; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Base64-encoded 256-bit key. Override JWT_SECRET in any non-local environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@pesira.com}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    user-email: ${SEED_USER_EMAIL:user@pesira.com}
    user-password: ${SEED_USER_PASSWORD:User@1234}
