    secret: dGVzdC1vbmx5LWp3dC1rZXktbm90LXVzZWQtb3V0c2lkZS10ZXN0cy0wMDAwMDA=
  seed:
    admin-email: admin@test.local
    admin-password: test-admin-pass-1
    user-email: user@test.local
    user-password: test-user-pass-1
