# Tests run the real Flyway migrations against in-memory H2 in PostgreSQL compatibility mode.
spring:
  datasource:
    url: jdbc:h2:mem:employees;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

